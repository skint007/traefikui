<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="route" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- Route paths representing traffic routing -->
  <!-- Main vertical trunk -->
  <path d="M256 112 L256 240" stroke="url(#route)" stroke-width="36" stroke-linecap="round" fill="none"/>
  <!-- Branch right -->
  <path d="M256 240 Q256 300 340 320 L380 330" stroke="url(#route)" stroke-width="36" stroke-linecap="round" fill="none"/>
  <!-- Branch left -->
  <path d="M256 240 Q256 300 172 320 L132 330" stroke="url(#route)" stroke-width="36" stroke-linecap="round" fill="none"/>
  <!-- Endpoint dots -->
  <circle cx="380" cy="330" r="28" fill="url(#route)"/>
  <circle cx="132" cy="330" r="28" fill="url(#route)"/>
  <circle cx="256" cy="112" r="28" fill="url(#route)"/>
  <!-- Small inner dots for endpoint feel -->
  <circle cx="380" cy="330" r="12" fill="#7c3aed"/>
  <circle cx="132" cy="330" r="12" fill="#7c3aed"/>
  <circle cx="256" cy="112" r="12" fill="#2563eb"/>
</svg>
